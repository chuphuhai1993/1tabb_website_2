
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Tabb Premium Glassmorphism Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            html {
                scroll-behavior: smooth;
            }
            body {
                @apply text-[var(--text-primary)] selection:bg-[#D4FF5B]/30 antialiased overflow-x-hidden min-h-screen font-sans bg-[var(--bg-primary)];
            }
        }
        :root {
            
            /* Light Mode Defaults */
            --primary: #99cc0a;
            --primary-glow: rgba(220, 255, 122, 0.363);
            --bg-primary: #f8f9fa;
            --text-primary: #1a1d14;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-bg-hover: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 1);
            --glass-glow: rgba(0, 0, 0, 0.1);
            --glass-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            --scrollbar-track: #f0f0f0;
            --scrollbar-thumb: #ccc;
            --scrollbar-thumb-hover: #bbb;
            --form-bg: rgba(0,0,0,0.03);
            --form-border: rgba(0,0,0,0.1);
            --bg-icon-start: rgba(255, 255, 255, 0.08);
            --bg-icon-end: rgba(255, 255, 255, 0.02);
        }
        .dark {
            /* Dark Mode Overrides */
            --primary: #D4FF5B;
            --primary-glow: #d4ff5b66;
            --bg-primary: #050505;
            --text-primary: rgba(255, 255, 255, 0.9);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-bg-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-glow: rgba(255, 255, 255, 0);
            --glass-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            --scrollbar-track: #050505;
            --scrollbar-thumb: #333;
            --scrollbar-thumb-hover: #444;
            --form-bg: rgba(255,255,255,0.03);
            --form-border: rgba(255,255,255,0.1);
            --bg-icon-start: rgba(255, 255, 255, 0.08);
            --bg-icon-end: rgba(255, 255, 255, 0.02);
        }
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-primary);
            transition: background-color 0.3s ease;
        }
        .blob {
            position: absolute;
            width: 40vw;
            height: 40vw;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
        }
        .blob-purple {
            top: -20%;
            left: -20%;
            width: 45vw;
            height: 45vw;
            background: #481697;
            animation: float-1 20s ease-in-out infinite;
        }
        .blob-lime {
            top: 15%;
            right: -15%;
            background: #a3ca38;
            opacity: 0.3;
            animation: float-2 25s ease-in-out infinite;
        }
        .blob-teal {
            bottom: -20%;
            left: 20%;
            width: 30vw;
            height: 30vw;
            background: #0c9bae;
            opacity: 0.2;
            animation: float-3 30s ease-in-out infinite;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: var(--glass-shadow);
        }
        .glass-card:hover {
            background: var(--glass-bg-hover);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }
        .glass-button {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            box-shadow: 0 0 40px var(--glass-glow);
        }
        .dark .glass-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .primary-glow-btn {
            border: 1px solid var(--primary-glow);
            color: var(--primary);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .primary-glow-btn:hover {
            color: var(--primary);
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .text-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        .dark .text-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        .icon-glass {
            background: linear-gradient(135deg, var(--bg-icon-start) 0%, var(--bg-icon-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--glass-glow);
        }
        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 1px;
            background: var(--primary);
            transition: all 0.3s ease;
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--primary);
        }
        .nav-link:hover::after {
            width: 100%;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover); 
        }
        .logo-slider {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .form-input {
            background: var(--form-bg);
            border: 1px solid var(--form-border);
            border-radius: 12px;
            color: inherit;
            transition: all 0.3s;
        }
        .form-input:focus {
            background: rgba(255,255,255,0.05);
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(212, 255, 91, 0.1);
            outline: none;
        }
        @keyframes float-1 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-20px) translateX(10px) rotate(10deg); }
        }
        @keyframes float-2 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-15px) translateX(-10px) rotate(-15deg); }
        }
        @keyframes float-3 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(15px) translateX(5px) rotate(8deg); }
        }
        .animate-float-1 { animation: float-1 6s ease-in-out infinite; }
        .animate-float-2 { animation: float-2 5s ease-in-out infinite; }
        .animate-float-3 { animation: float-3 7s ease-in-out infinite; }
        
        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }
        @keyframes marquee-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        @keyframes marquee-down {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }
        .animate-marquee-left {
            animation: marquee-left 30s linear infinite;
        }
        .animate-marquee-right {
            animation: marquee-right 30s linear infinite;
        }
        .animate-marquee-up {
            animation: marquee-up 30s linear infinite;
        }
        .animate-marquee-down {
            animation: marquee-down 30s linear infinite;
        }
        @keyframes gradient-x {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .animate-gradient-x {
            background-size: 200% auto;
            animation: gradient-x 4s linear infinite;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#D4FF5B",
                        glass: "rgba(255, 255, 255, 0.05)"
                    },
                    fontFamily: {
                        serif: ["Noto Serif Display", "serif"],
                        mono: ["IBM Plex Mono", "monospace"],
                        sans: ["Geist Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
